name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Node.js and browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        run: npm test
      - name: Run browser tests
        run: npm run test:e2e -- --config playwright.mobile.config.cjs
      - name: Upload Chromium screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chromium-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  android-compile:
    name: Android release package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync Capacitor assets
        run: npm run android:sync
      - name: Compile Android Java
        working-directory: android
        run: bash ./gradlew :app:compileDebugJavaWithJavac --no-daemon
      - name: Build unsigned release
        working-directory: android
        run: bash ./gradlew :app:assembleRelease --no-daemon
      - name: Align release and stage signing tool
        shell: bash
        run: |
          set -euo pipefail
          unsigned=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$build_tools"
          test -x "$build_tools/zipalign"
          test -s "$build_tools/lib/apksigner.jar"
          staged="$RUNNER_TEMP/scirun-unsigned-release"
          mkdir -p "$staged"
          "$build_tools/zipalign" -P 16 -f -v 4 "$unsigned" "$staged/app-release-aligned-unsigned.apk"
          "$build_tools/zipalign" -c -P 16 -v 4 "$staged/app-release-aligned-unsigned.apk"
          cp "$build_tools/lib/apksigner.jar" "$staged/apksigner.jar"
          java -jar "$staged/apksigner.jar" version
          (cd "$staged" && sha256sum app-release-aligned-unsigned.apk apksigner.jar > SHA256SUMS)
      - name: Upload unsigned release for local signing
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scirun-unsigned-release
          path: ${{ runner.temp }}/scirun-unsigned-release/
          if-no-files-found: error
          retention-days: 7
