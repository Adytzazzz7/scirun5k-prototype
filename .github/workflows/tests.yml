name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Node.js and browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        run: npm test
      - name: Run browser tests
        run: npm run test:e2e -- --config playwright.mobile.config.cjs
      - name: Upload Chromium screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chromium-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  android-compile:
    name: Android Java compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync Capacitor assets
        run: npm run android:sync
      - name: Compile Android Java
        working-directory: android
        run: bash ./gradlew :app:compileDebugJavaWithJavac --no-daemon
